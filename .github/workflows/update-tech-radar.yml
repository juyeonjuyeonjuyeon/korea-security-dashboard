name: Update official technology radar

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-dashboard
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Check official releases, events and people radar
        env:
          TECH_MODE: flash
        run: node scripts/update-tech.mjs
      - name: Commit only when technology data changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/tech.json
          git diff --cached --quiet || git commit -m "공식 기술 레이더 매시간 갱신"
          git push
